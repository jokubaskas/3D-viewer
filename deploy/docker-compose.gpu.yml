# NVIDIA GPU pagreitinimas (reikia nvidia-container-toolkit)
services:
  nodeodm:
    build:
      args:
        NODEODM_IMAGE: opendronemap/nodeodm:${ODM_VERSION:-3.6.2}-gpu
    image: atea3d-nodeodm:${ODM_VERSION:-3.6.2}-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # „Realistiškas vaizdas“ (Gaussian Splatting) – tik su NVIDIA GPU (deploy/splat)
  splat:
    build: ./splat
    restart: unless-stopped
    volumes:
      - nodeodm-data:/odm-data:ro
      - splat-data:/data
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ai:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu124
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
