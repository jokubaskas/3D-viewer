# NVIDIA GPU pagreitinimas (reikia nvidia-container-toolkit)
services:
  nodeodm:
    build:
      args:
        NODEODM_IMAGE: opendronemap/nodeodm:${ODM_VERSION:-3.6.2}-gpu
    image: atea3d-nodeodm:${ODM_VERSION:-3.6.2}-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Atea variklis – nuotraukos → 3D modelis, ortofoto, DSM / DTM ir realistiškas vaizdas (deploy/engine). Tik su NVIDIA GPU.
  engine:
    build: ./engine
    restart: unless-stopped
    volumes:
      - engine-data:/engine-data
      - nodeodm-data:/odm-data:ro
      - splat-data:/data
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ai:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu124
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
