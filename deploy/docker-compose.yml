# Atea 3D Matuoklis + OpenDroneMap apdorojimo serveris
#
#   cp .env.example .env      # nustatykite NODEODM_TOKEN
#   docker compose up -d --build
#
# Programa: http://<serveris>:8080   (NodeODM pasiekiamas per /odm/)
# Su NVIDIA GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

services:
  nodeodm:
    image: opendronemap/nodeodm:${NODEODM_TAG:-latest}
    restart: unless-stopped
    command:
      - --port=3000
      - --token=${NODEODM_TOKEN:?Nustatykite NODEODM_TOKEN faile .env}
      # Kiek užduočių apdoroti vienu metu (daugiau – reikia daugiau RAM)
      - --parallel_queue_processing=${NODEODM_PARALLEL:-1}
      # Rezultatus laikyti 30 dienų (numatyta tik 2 paros)
      - --cleanup_tasks_after=${NODEODM_KEEP_MINUTES:-43200}
      # Nebaigtus įkėlimus išvalyti po 2 parų
      - --cleanup_uploads_after=2880
    volumes:
      - nodeodm-data:/var/www/data
    # Atminties riba (didiems projektams reikia 64–128 GB)
    # mem_limit: 96g
    expose:
      - "3000"

  # Vietinė AI paslauga: transporto aptikimas ir išmanus kontūras (be interneto, be mokesčių)
  ai:
    build:
      context: ./ai
      args:
        TORCH_INDEX: ${AI_TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
        DETECTOR: ${AI_DETECTOR:-medium}
    restart: unless-stopped
    environment:
      - ATEA_AI_THREADS=${AI_THREADS:-4}
    volumes:
      # Savi (apmokyti) modeliai – išlieka atnaujinus ar perkūrus AI konteinerį
      - ai-models:/models/custom
    expose:
      - "8000"

  # Tiesioginės transliacijos: RTSP / RTMP / SRT → WebRTC / HLS naršyklei
  mediamtx:
    image: bluenviron/mediamtx:${MEDIAMTX_TAG:-1.21.2}
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    environment:
      - MTX_WEBRTCADDITIONALHOSTS=${LIVE_HOSTS:-127.0.0.1}
    expose:
      - "9997"
      - "8888"
      - "8889"
    ports:
      # Dronas / kamera siunčia transliaciją į kompiuterį (pvz. rtmp://192.168.1.10:1935/drone)
      - "${LIVE_RTMP_PORT:-1935}:1935"
      - "${LIVE_RTSP_PORT:-8554}:8554"
      - "${LIVE_SRT_PORT:-8890}:8890/udp"
      # WebRTC vaizdas naršyklei
      - "8189:8189/udp"
      - "8189:8189/tcp"

  # Portalas: paskyros (admin / klientai), prieigos teisės, klientams priskirti duomenys
  portal:
    build:
      context: ./portal
    restart: unless-stopped
    environment:
      # Adresas, kuriuo klientai atidaro programą (kvietimo nuorodoms), pvz. https://3d.jusu-domenas.lt
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8080}
      - MEDIAMTX_API=http://mediamtx:9997
    volumes:
      # Duomenų bazė ir klientų failai (3D modeliai, ataskaitos, įrašai) – išlieka atnaujinus programą
      - portal-data:/data
    expose:
      - "8000"

  # Prieiga iš interneto per Cloudflare Tunnel (be atvirų prievadų maršrutizatoriuje, su HTTPS).
  # Įjungiama, kai .env faile nustatytas CF_TUNNEL_TOKEN (start-windows.bat paleidžia su --profile internet).
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-2024.12.2}
    restart: unless-stopped
    profiles: ["internet"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:-}
    depends_on:
      - web

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      - nodeodm
      - ai
      - portal
    environment:
      # nginx prideda raktą prie /odm/ užklausų – programoje jo vesti nereikia
      - NODEODM_TOKEN=${NODEODM_TOKEN}
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  nodeodm-data:
  ai-models:
  portal-data:
